# Lints every cask and formula, and installs each cask from its published release.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use this checkout as the tap
        run: |
          TAP="$(brew --repository)/Library/Taps/alexandernygard/homebrew-tap"
          mkdir -p "$(dirname "$TAP")"
          ln -s "$GITHUB_WORKSPACE" "$TAP"
          brew trust alexandernygard/tap

      - name: Style
        run: brew style alexandernygard/tap

      - name: Audit
        run: brew audit --tap alexandernygard/tap

      - name: Install casks
        run: |
          for f in Casks/*.rb; do
            brew install --cask "alexandernygard/tap/$(basename "$f" .rb)"
          done
